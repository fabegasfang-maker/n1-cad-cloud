name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install & build
        working-directory: apps/web
        env:
          # ตั้งใน GitHub → Settings → Secrets: VITE_API_BASE
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_DEFAULT_FOLDER_ID: ${{ secrets.VITE_DEFAULT_FOLDER_ID || '1mP47qarQZxPF-ln5Dy7VZrJlcq0uPJ4D' }}
        run: |
          npm install
          if [ -z "$VITE_API_BASE" ]; then
            echo "WARNING: VITE_API_BASE secret is empty — web will default to localhost"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
